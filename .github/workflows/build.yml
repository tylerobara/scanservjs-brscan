name: Build and Push Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read upstream scanservjs version
        id: version
        run: echo "scanservjs=$(grep -oP '^ARG SCANSERVJS_VERSION=\K.+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SCANSERVJS_VERSION=${{ steps.version.outputs.scanservjs }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.scanservjs }}-brscan-${{ steps.date.outputs.date }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Grype vulnerability scan (informational, non-blocking)
        continue-on-error: true
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.scanservjs }}-brscan-${{ steps.date.outputs.date }}
        run: |
          docker pull "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:latest "$IMAGE" -o table
